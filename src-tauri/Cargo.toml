[package]
name = "ember-widget"
version = "2.3.1"
description = "Ember — desktop widget showing Claude Code + ChatGPT Codex token usage, API-equivalent cost, plan limits, and what a percent of your plan actually buys"
authors = ["Harshal Vankudre"]
license = "MIT"
repository = "https://github.com/HarshalVankudre/Ember-usage-widget"
edition = "2021"

[lib]
name = "ember_widget_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
regex = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
sha2 = "0.10"
dirs = "6"
notify = "8"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["macros", "time", "sync", "rt-multi-thread", "process"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Storage_FileSystem"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
