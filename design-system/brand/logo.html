<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ember · Mark</title>
<style>
  body { margin: 0; padding: 20px; background: #0d0806; color: #f9f3e8;
         font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
  h1 { margin: 0 0 4px; font-family: "Bahnschrift", sans-serif; font-size: 13px;
       letter-spacing: .14em; text-transform: uppercase; color: #d9cab7; }
  .intro { margin: 0 0 18px; font-size: 11px; color: #a8988a; }
  .row { display: flex; align-items: flex-end; gap: 26px; }
  .cell { display: grid; gap: 8px; justify-items: center; }
  .cell small { color: #87786a; font-size: 9px; font-variant-numeric: tabular-nums; }
  .dark { padding: 14px; border-radius: 12px; background: #21160f; display: grid; place-items: center; }
</style>
</head>
<body>
  <h1>The Ember mark</h1>
  <p class="intro">The initial E drawn as incandescent meter bars — the same rounded gauges the widget uses, heated from gold to deep ember. Badge for app surfaces; bare glyph for the tray and inline use. It pulses with the widget's plan-pressure states.</p>
  <div class="row">
    <div class="cell">
      <svg width="128" height="128" viewBox="0 0 64 64">
        <defs>
          <linearGradient id="e1" gradientUnits="userSpaceOnUse" x1="0" y1="14" x2="0" y2="50">
            <stop offset="0" stop-color="#ffd166"/><stop offset=".55" stop-color="#ff8d4a"/><stop offset="1" stop-color="#ff5f2e"/>
          </linearGradient>
        </defs>
        <rect x="3" y="3" width="58" height="58" rx="15" fill="#160e08"/>
        <rect x="3.5" y="3.5" width="57" height="57" rx="14.5" fill="none" stroke="#ffa05c" stroke-opacity=".16"/>
        <g fill="url(#e1)">
          <rect x="19" y="14" width="8" height="36" rx="4"/><rect x="19" y="14" width="27" height="8" rx="4"/>
          <rect x="19" y="28" width="22" height="8" rx="4"/><rect x="19" y="42" width="27" height="8" rx="4"/>
        </g>
      </svg>
      <small>badge · 128</small>
    </div>
    <div class="cell">
      <svg width="48" height="48" viewBox="0 0 64 64">
        <defs><linearGradient id="e2" gradientUnits="userSpaceOnUse" x1="0" y1="14" x2="0" y2="50">
          <stop offset="0" stop-color="#ffd166"/><stop offset=".55" stop-color="#ff8d4a"/><stop offset="1" stop-color="#ff5f2e"/>
        </linearGradient></defs>
        <rect x="3" y="3" width="58" height="58" rx="15" fill="#160e08"/>
        <g fill="url(#e2)">
          <rect x="19" y="14" width="8" height="36" rx="4"/><rect x="19" y="14" width="27" height="8" rx="4"/>
          <rect x="19" y="28" width="22" height="8" rx="4"/><rect x="19" y="42" width="27" height="8" rx="4"/>
        </g>
      </svg>
      <small>48</small>
    </div>
    <div class="cell">
      <svg width="24" height="24" viewBox="0 0 64 64">
        <defs><linearGradient id="e3" gradientUnits="userSpaceOnUse" x1="0" y1="14" x2="0" y2="50">
          <stop offset="0" stop-color="#ffd166"/><stop offset=".55" stop-color="#ff8d4a"/><stop offset="1" stop-color="#ff5f2e"/>
        </linearGradient></defs>
        <rect x="3" y="3" width="58" height="58" rx="15" fill="#160e08"/>
        <g fill="url(#e3)">
          <rect x="19" y="14" width="8" height="36" rx="4"/><rect x="19" y="14" width="27" height="8" rx="4"/>
          <rect x="19" y="28" width="22" height="8" rx="4"/><rect x="19" y="42" width="27" height="8" rx="4"/>
        </g>
      </svg>
      <small>24</small>
    </div>
    <div class="cell">
      <div class="dark">
        <svg width="32" height="32" viewBox="14 10 36 44">
          <defs><linearGradient id="e4" gradientUnits="userSpaceOnUse" x1="0" y1="14" x2="0" y2="50">
            <stop offset="0" stop-color="#ffd166"/><stop offset=".55" stop-color="#ff8d4a"/><stop offset="1" stop-color="#ff5f2e"/>
          </linearGradient></defs>
          <g fill="url(#e4)">
            <rect x="19" y="14" width="8" height="36" rx="4"/><rect x="19" y="14" width="27" height="8" rx="4"/>
            <rect x="19" y="28" width="22" height="8" rx="4"/><rect x="19" y="42" width="27" height="8" rx="4"/>
          </g>
        </svg>
      </div>
      <small>tray glyph</small>
    </div>
  </div>
</body>
</html>
