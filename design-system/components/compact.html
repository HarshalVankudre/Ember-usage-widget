<!-- @dsCard group="Components" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ember · Compact strip</title>
<style>
  body { margin: 0; padding: 20px; background: #21160f; display: grid; place-items: center; min-height: 140px;
         font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
  .mini { display: flex; align-items: center; gap: 11px; width: 348px; height: 84px;
          padding: 9px 7px 9px 14px; border-radius: 12px; border: 1px solid rgba(255,190,140,.09);
          background: radial-gradient(130% 90% at 100% 0%, rgba(255,109,59,.12), transparent 52%), rgba(13,8,6,.96);
          box-shadow: 0 22px 70px rgba(0,0,0,.5); color: #f9f3e8; }
  .flame { flex: 0 0 auto; }
  .bodyc { display: grid; flex: 1 1 auto; gap: 4px; min-width: 0; }
  .top { display: flex; align-items: baseline; gap: 8px; }
  .cost { font-family: "Bahnschrift", sans-serif; font-size: 19px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .cost .cur { position: relative; top: -.42em; margin-right: 2px; color: #ff6d3b; font-size: .5em; }
  .cost .dec { color: #d9cab7; font-size: .62em; }
  .when { color: #a8988a; font-size: 9px; }
  .meter { display: flex; align-items: center; gap: 7px; }
  .bar { flex: 1 1 auto; height: 4px; border-radius: 3px; background: #271d12; overflow: hidden;
         box-shadow: inset 0 1px 1px rgba(0,0,0,.3); }
  .bar i { display: block; width: 41%; height: 100%; background: #d97757; border-radius: inherit; }
  .pct { font-family: "Bahnschrift", sans-serif; color: #d9cab7; font-size: 9.5px; }
  .sub { color: #87786a; font-size: 8px; }
</style>
</head>
<body>
  <div class="mini">
    <svg class="flame" width="26" height="31" viewBox="14 10 36 44">
      <defs>
        <linearGradient id="miniE" gradientUnits="userSpaceOnUse" x1="0" y1="14" x2="0" y2="50">
          <stop offset="0" stop-color="#ffd166"/><stop offset=".55" stop-color="#ff8d4a"/><stop offset="1" stop-color="#ff5f2e"/>
        </linearGradient>
      </defs>
      <g fill="url(#miniE)">
        <rect x="19" y="14" width="8" height="36" rx="4"/><rect x="19" y="14" width="27" height="8" rx="4"/>
        <rect x="19" y="28" width="22" height="8" rx="4"/><rect x="19" y="42" width="27" height="8" rx="4"/>
      </g>
    </svg>
    <div class="bodyc">
      <div class="top"><span class="cost"><span class="cur">$</span>30<span class="dec">.73</span></span><span class="when">session · 4 hr 11 min left</span></div>
      <div class="meter"><span class="bar"><i></i></span><span class="pct">41%</span></div>
      <div class="sub">15.18M tokens · 71 calls</div>
    </div>
  </div>
</body>
</html>
