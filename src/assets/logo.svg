<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="88" height="88">
  <!-- Ember mark: the initial E as incandescent meter bars — heated metal,
       gold at the top of the flame, deep ember at the base. -->
  <defs>
    <linearGradient id="emberE" gradientUnits="userSpaceOnUse" x1="0" y1="14" x2="0" y2="50">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset=".55" stop-color="#ff8d4a"/>
      <stop offset="1" stop-color="#ff5f2e"/>
    </linearGradient>
  </defs>
  <rect x="3" y="3" width="58" height="58" rx="15" fill="#160e08"/>
  <rect x="3.5" y="3.5" width="57" height="57" rx="14.5" fill="none" stroke="#ffa05c" stroke-opacity=".16"/>
  <g fill="url(#emberE)">
    <rect x="19" y="14" width="8" height="36" rx="4"/>
    <rect x="19" y="14" width="27" height="8" rx="4"/>
    <rect x="19" y="28" width="22" height="8" rx="4"/>
    <rect x="19" y="42" width="27" height="8" rx="4"/>
  </g>
</svg>
